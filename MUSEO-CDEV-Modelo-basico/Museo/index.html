<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Museo Virtual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <div id="help">
      <h1>Museo Virtual</h1>
      <p>Click para entrar</p>
      <p>WASD: moverse · Mouse: mirar · Shift: correr · Espacio: saltar · E: interactuar</p>
      <p>1-9: seleccionar item · Scroll: cambiar item</p>
      <small>Esc para salir del modo cursor</small>
    </div>
    <div id="crosshair">
      <div class="crosshair-line crosshair-horizontal"></div>
      <div class="crosshair-line crosshair-vertical"></div>
      <div class="crosshair-center"></div>
    </div>
    <div id="hotbar">
      <div class="hotbar-slot" data-slot="1">
        <span class="slot-number">1</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="2">
        <span class="slot-number">2</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="3">
        <span class="slot-number">3</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="4">
        <span class="slot-number">4</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot active" data-slot="5">
        <span class="slot-number">5</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="6">
        <span class="slot-number">6</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="7">
        <span class="slot-number">7</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="8">
        <span class="slot-number">8</span>
        <div class="slot-item"></div>
      </div>
      <div class="hotbar-slot" data-slot="9">
        <span class="slot-number">9</span>
        <div class="slot-item"></div>
      </div>
    </div>
    <div id="label"></div>
    <div id="art-info" class="hidden">
      <button id="close-info" title="Cerrar">×</button>
      <h2 id="art-title"></h2>
      <p id="art-author" class="art-author"></p>
      <p id="art-desc"></p>
    </div>
  </div>

  <canvas id="miCanvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
